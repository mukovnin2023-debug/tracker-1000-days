<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статистика — Трекер челленджа</title>
<style>
  body{
    max-width:640px; margin:0 auto; padding:24px 16px 60px;
    font-family:-apple-system,Manrope,sans-serif;
    color:#1A1A1A; line-height:1.5; font-size:15px;
  }
  h1{ font-size:22px; }
  h2{ font-size:16px; margin-top:28px; }
  .row{
    display:flex; justify-content:space-between;
    padding:8px 0; border-bottom:1px solid #eee;
  }
  .bar-outer{ background:#F0F0EC; border-radius:4px; height:8px; margin-top:4px; overflow:hidden; }
  .bar-inner{ background:#1A1A1A; height:100%; }
  .totals{ display:flex; gap:16px; margin:16px 0; flex-wrap:wrap; }
  .totals div{ background:#F6F6F2; border:2px solid #1A1A1A; border-radius:8px; padding:10px 14px; }
  .totals .num{ font-weight:800; font-size:24px; }
  .totals .label{ font-size:12px; color:#555; }
</style>
</head>
<body>
<h1>Статистика трекера (только для автора)</h1>
<div id="content">Загрузка…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDM5zsOLzX7Pv7YAA9VPW0d9zVdwVwSKxs",
  authDomain: "tracker-1000-ed42a.firebaseapp.com",
  projectId: "tracker-1000-ed42a",
  storageBucket: "tracker-1000-ed42a.firebasestorage.app",
  messagingSenderId: "292947247763",
  appId: "1:292947247763:web:11931f037bea33f3584366"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function load(){
  const [totalsSnap, categoriesSnap, clicksSnap] = await Promise.all([
    getDoc(doc(db, 'stats', 'totals')),
    getDoc(doc(db, 'stats', 'categories')),
    getDoc(doc(db, 'stats', 'clicks'))
  ]);

  const total = totalsSnap.exists() ? (totalsSnap.data().trackers || 0) : 0;
  const categories = categoriesSnap.exists() ? categoriesSnap.data() : {};
  const clicks = clicksSnap.exists() ? clicksSnap.data() : {};
  const authorOpen = clicks.author_open || 0;
  const instagramClick = clicks.instagram_click || 0;

  const catEntries = Object.entries(categories).sort((a,b) => b[1]-a[1]);
  const maxCat = Math.max(1, ...catEntries.map(c => c[1]));
  const catRows = catEntries.map(([name, cnt]) => {
    const pct = total ? Math.round((cnt/total)*100) : 0;
    const barPct = Math.round((cnt/maxCat)*100);
    return `<div class="row"><span>${name}</span><span>${cnt} (${pct}%)</span></div>
            <div class="bar-outer"><div class="bar-inner" style="width:${barPct}%"></div></div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="totals">
      <div><div class="num">${total}</div><div class="label">всего трекеров создано</div></div>
      <div><div class="num">${authorOpen}</div><div class="label">открыли «Автор трекера»</div></div>
      <div><div class="num">${instagramClick}</div><div class="label">перешли в Instagram</div></div>
    </div>
    <h2>По сферам</h2>
    ${catRows || '<p>Пока нет данных.</p>'}
  `;
}
load();
</script>
</body>
</html>
